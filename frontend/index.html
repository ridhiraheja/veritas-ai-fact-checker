<!DOCTYPE html>
<html>
<head>
<title>AI Fact Checker</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #2b5876);
    color: white;
    display: flex;
}

/* Sidebar */
#history {
    width: 25%;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    padding: 15px;
    overflow-y: auto;
    height: 100vh;
}

.history-item {
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    cursor: pointer;
    transition: 0.3s;
}

.history-item:hover {
    background: rgba(255,255,255,0.3);
}

/* Chat Area */
#chat-container {
    width: 75%;
    display: flex;
    flex-direction: column;
    padding: 20px;
}

#chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}

/* Chat bubbles */
.bubble {
    padding: 12px;
    margin: 10px;
    border-radius: 15px;
    max-width: 60%;
    animation: fadeIn 0.4s ease;
}

.user {
    background: #4facfe;
    margin-left: auto;
}

.bot {
    background: rgba(255,255,255,0.1);
}

/* Verdict colors */
.true { border-left: 5px solid #00ff88; }
.false { border-left: 5px solid #ff4d4d; }
.uncertain { border-left: 5px solid orange; }

/* Input */
#input-area {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
}

button {
    padding: 12px 20px;
    border: none;
    background: #00c6ff;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #0072ff;
}

/* Progress bar */
.progress {
    background: #444;
    border-radius: 10px;
    margin-top: 5px;
}

.progress-bar {
    height: 10px;
    border-radius: 10px;
    background: linear-gradient(90deg, #00ff88, #00c6ff);
    animation: grow 1s ease;
}

/* Animations */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}

@keyframes grow {
    from {width: 0;}
    to {width: 100%;}
}
</style>
</head>

<body>

<!-- Sidebar -->
<div id="history">
    <h3>🕘 History</h3>
    <div id="history-list"></div>
</div>

<!-- Chat -->
<div id="chat-container">

<h2>🤖 AI Fact Checker</h2>

<div id="chat-box"></div>

<div id="input-area">
    <input id="input" placeholder="Type a fact..." />
    <button onclick="sendMessage()">Send</button>
</div>

</div>

<script>
const chatBox = document.getElementById("chat-box");

/* Typing animation */
function typeText(element, text) {
    let i = 0;
    element.innerHTML = "";
    function typing() {
        if (i < text.length) {
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, 15);
        }
    }
    typing();
}

/* Add message */
function addMessage(text, type, verdict=null, confidence=null) {
    const div = document.createElement("div");
    div.classList.add("bubble", type);

    if (verdict) {
        if (verdict.includes("True")) div.classList.add("true");
        else if (verdict.includes("False")) div.classList.add("false");
        else div.classList.add("uncertain");
    }

    chatBox.appendChild(div);

    if (type === "bot") {
        typeText(div, text);
    } else {
        div.innerText = text;
    }

    if (confidence) {
        const percent = parseInt(confidence);

        const bar = document.createElement("div");
        bar.className = "progress";

        const inner = document.createElement("div");
        inner.className = "progress-bar";
        inner.style.width = percent + "%";

        bar.appendChild(inner);
        div.appendChild(bar);
    }

    chatBox.scrollTop = chatBox.scrollHeight;
}

/* Send message */
async function sendMessage() {
    const input = document.getElementById("input");
    const statement = input.value;

    addMessage(statement, "user");

    const res = await fetch("http://127.0.0.1:5000/fact-check", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ statement })
    });

    const data = await res.json();
    
    if (data.status === "error") {
        addMessage(`❌ Error: ${data.error}`, "bot");
        if (data.details) {
            console.error("Backend Error Details:", data.details);
        }
        input.value = "";
        return;
    }

    const result = data.result;
    const verdict = result.match(/Verdict: (.*)/)?.[1];
    const confidence = result.match(/Confidence: (.*)/)?.[1];

    addMessage(result, "bot", verdict, confidence);

    input.value = "";
    loadHistory();
}

/* Load history */
async function loadHistory() {
    const res = await fetch("http://127.0.0.1:5000/history");
    const data = await res.json();

    const historyDiv = document.getElementById("history-list");
    historyDiv.innerHTML = "";

    data.reverse().forEach(item => {
        const div = document.createElement("div");
        div.className = "history-item";
        
        let timeStr = "";
        if (item.timestamp) {
            const date = new Date(item.timestamp.includes(' ') ? item.timestamp.replace(' ', 'T') : item.timestamp);
            timeStr = `<small style="display:block; opacity:0.6">${date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</small>`;
        }

        div.innerHTML = `<strong>${item.statement}</strong>${timeStr}`;

        div.onclick = () => {
            addMessage(item.statement, "user");
            addMessage(item.response, "bot");
        };

        historyDiv.appendChild(div);
    });
}

loadHistory();
</script>

</body>
</html>
